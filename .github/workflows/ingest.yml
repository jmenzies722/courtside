name: ingest

on:
  pull_request:
    paths: ["services/ingest/**", ".github/workflows/ingest.yml"]
  push:
    branches: [main]
    paths: ["services/ingest/**", ".github/workflows/ingest.yml"]

# Least privilege: this workflow can only read the repo
permissions:
  contents: read

defaults:
  run:
    working-directory: services/ingest

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: services/ingest/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests

  build:
    needs: test            # don't bother building if tests fail
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t courtside-ingest:${{ github.sha }} .
      - name: "Smoke test: image starts and stops cleanly"
        run: |
          docker run -d --name smoke -e POLL_SECONDS=2 courtside-ingest:${{ github.sha }}
          sleep 5
          docker stop smoke
          code=$(docker inspect smoke --format '{{.State.ExitCode}}')
          docker logs smoke 2>&1 | grep -v game_id
          test "$code" = "0"
