# Local SQS stand-in (ElasticMQ). Mirrors the real queues we'll create in AWS later.
include classpath("application.conf")

queues {
  # Main queue: ingest sends here, stats reads from here
  game-events {
    defaultVisibilityTimeout = 30 seconds   # a reader has 30s to finish before the message reappears
    deadLettersQueue {
      name = "game-events-dlq"
      maxReceiveCount = 5                   # failed 5 times? park it in the DLQ, don't retry forever
    }
  }

  # Dead-letter queue: poison messages wait here for a human to look
  game-events-dlq { }

  # Every real play (one message per play), for play-by-play and win probability
  play-events {
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue {
      name = "play-events-dlq"
      maxReceiveCount = 5
    }
  }
  play-events-dlq { }
}
